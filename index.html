<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Blog</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .logo {
            width: 120px;
            height: 120px;
            background: navy;
            color: white;
            display: inline-block;
            text-align: center;
            line-height: 120px;
            border-radius: 60px;
        }
        .time {
            margin: 10px 0;
            font-size: 18px;
        }
        .shortcut {
            display: inline-block;
            margin: 5px;
            padding: 5px 10px;
            background: #eee;
            text-decoration: none;
            color: black;
            border-radius: 5px;
        }
        .post {
            border-bottom: 1px solid #ccc;
            padding: 20px 0;
        }
        .post h2 a {
            text-decoration: none;
            color: #333;
        }
        .post h2 a:hover {
            color: blue;
        }
        .readmore {
            display: inline-block;
            margin-top: 10px;
            color: blue;
            cursor: pointer;
            text-decoration: none;
        }
        .loading {
            text-align: center;
            padding: 50px;
            color: #999;
        }
    </style>
</head>
<body>

<div style="text-align: center;">
    <div class="logo">BLOG</div>
    <div class="time" id="time"></div>
    <div id="shortcuts"></div>
</div>

<div id="posts"><div class="loading">Loading posts...</div></div>

<script>
// Time
function showTime() {
    var d = new Date();
    var h = d.getHours();
    var m = d.getMinutes();
    var s = d.getSeconds();
    if (h < 10) h = '0' + h;
    if (m < 10) m = '0' + m;
    if (s < 10) s = '0' + s;
    document.getElementById('time').innerHTML = h + ':' + m + ':' + s;
}
showTime();
setInterval(showTime, 1000);

// Shortcuts
var sites = ['GitHub', 'Google', 'StackOverflow', 'Juejin', 'Zhihu', 'RuanYifeng', 'Vue', 'React', 'Tailwind', 'MDN'];
var urls = ['https://github.com', 'https://google.com', 'https://stackoverflow.com', 'https://juejin.cn', 'https://zhihu.com', 'https://ruanyifeng.com', 'https://vuejs.org', 'https://reactjs.org', 'https://tailwindcss.com', 'https://developer.mozilla.org'];

var shortcutHtml = '';
for (var i = 0; i < sites.length; i++) {
    shortcutHtml = shortcutHtml + '<a class="shortcut" href="' + urls[i] + '" target="_blank">' + sites[i] + '</a>';
}
document.getElementById('shortcuts').innerHTML = shortcutHtml;

// Posts data (hardcoded first, will load from md later)
var posts = [
    {title: 'Welcome to My Blog', date: '2026-04-26', content: '<p>Welcome to my blog. This is the first post.</p><h2>Why Blog?</h2><p>Share knowledge and experiences.</p>', excerpt: 'Welcome to my blog. This is the first post.'},
    {title: 'EdgeOne Pages Tutorial', date: '2026-04-25', content: '<p>EdgeOne Pages is a great platform for static sites.</p><h2>Steps</h2><ol><li>Login</li><li>Import repo</li><li>Deploy</li></ol>', excerpt: 'EdgeOne Pages is a great platform for static sites.'},
    {title: 'Markdown Guide', date: '2026-04-24', content: '<p>Markdown is a lightweight markup language.</p><h2>Syntax</h2><ul><li>Headers: #</li><li>Lists: -</li><li>Bold: **</li></ul>', excerpt: 'Markdown is a lightweight markup language.'}
];

// Show post
function viewPost(idx) {
    var p = posts[idx];
    var w = window.open();
    var doc = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + p.title + '</title>';
    doc = doc + '<style>body{font-family:Arial;max-width:800px;margin:0 auto;padding:40px;line-height:1.8;}</style>';
    doc = doc + '</head><body>';
    doc = doc + '<h1>' + p.title + '</h1>';
    doc = doc + '<p style="color:#999;">' + p.date + '</p><hr>';
    doc = doc + p.content;
    doc = doc + '<hr><p><a href="javascript:window.close()">Close</a></p>';
    doc = doc + '</body></html>';
    w.document.write(doc);
    w.document.close();
}

// Render posts
var postsHtml = '';
for (var i = 0; i < posts.length; i++) {
    var p = posts[i];
    var minutes = Math.ceil(p.excerpt.length / 200);
    if (minutes < 1) minutes = 1;
    postsHtml = postsHtml + '<div class="post">';
    postsHtml = postsHtml + '<h2><a href="javascript:viewPost(' + i + ')">' + p.title + '</a></h2>';
    postsHtml = postsHtml + '<div>' + p.date + ' | ' + minutes + ' min read</div>';
    postsHtml = postsHtml + '<p>' + p.excerpt + '</p>';
    postsHtml = postsHtml + '<a class="readmore" href="javascript:viewPost(' + i + ')">Read More →</a>';
    postsHtml = postsHtml + '</div>';
}
document.getElementById('posts').innerHTML = postsHtml;
</script>

</body>
</html>
