<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>张小明的博客 | 技术分享</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
            color: #1a202c;
            line-height: 1.7;
            min-height: 100vh;
        }
        
        /* 粒子背景效果 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at 25% 50%, rgba(102, 126, 234, 0.03) 0%, transparent 50%),
                              radial-gradient(circle at 75% 30%, rgba(118, 75, 162, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
            display: flex;
            gap: 28px;
            position: relative;
            z-index: 1;
        }
        
        /* 左侧边栏 */
        .sidebar-left {
            width: 280px;
            flex-shrink: 0;
            position: sticky;
            top: 24px;
        }
        
        .logo-area {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 28px 20px;
            text-align: center;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .logo-area:hover {
            transform: translateY(-2px);
            box-shadow: 0 25px 40px -15px rgba(0,0,0,0.15);
        }
        
        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 18px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
        }
        
        .logo:hover {
            transform: scale(1.02);
        }
        
        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .logo-text {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 26px;
            font-weight: bold;
            margin: 0 auto 18px;
            transition: transform 0.3s ease;
        }
        
        .logo-text:hover {
            transform: scale(1.02);
        }
        
        .beijing-time {
            font-size: 18px;
            font-weight: 600;
            color: #2d3748;
            background: linear-gradient(135deg, #edf2f7 0%, #e2e8f0 100%);
            padding: 10px 16px;
            border-radius: 40px;
            display: inline-block;
            font-family: 'Monaco', 'Menlo', monospace;
            letter-spacing: 1px;
        }
        
        .shortcuts-area {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.5);
            height: calc(100vh - 280px);
            min-height: 450px;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }
        
        .shortcuts-area:hover {
            transform: translateY(-2px);
        }
        
        .shortcuts-area h3 {
            font-size: 16px;
            color: #4a5568;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            letter-spacing: 0.5px;
        }
        
        .shortcuts-area h3::before {
            content: '✨';
            font-size: 18px;
        }
        
        .shortcut-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }
        
        .shortcut-buttons::-webkit-scrollbar {
            width: 5px;
        }
        
        .shortcut-buttons::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 10px;
        }
        
        .shortcut-buttons::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
        }
        
        .shortcut {
            display: block;
            padding: 10px 14px;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-radius: 14px;
            text-decoration: none;
            color: #3182ce;
            font-weight: 500;
            border: 1px solid #e2e8f0;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 14px;
            position: relative;
            overflow: hidden;
        }
        
        .shortcut::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }
        
        .shortcut:hover::before {
            left: 100%;
        }
        
        .shortcut:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: translateX(6px);
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        
        /* 中间区域 */
        .content-center {
            flex: 1;
            min-width: 0;
        }
        
        .blog-header {
            margin-bottom: 28px;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
        }
        
        .blog-header:hover {
            transform: translateY(-2px);
        }
        
        .header-bg {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 70px 40px;
            text-align: center;
            position: relative;
        }
        
        .header-bg-default {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .header-bg h1 {
            font-size: 48px;
            color: white;
            margin-bottom: 12px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.2);
            letter-spacing: 2px;
            font-weight: 700;
        }
        
        .header-bg p {
            color: rgba(255,255,255,0.95);
            font-size: 18px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.15);
            letter-spacing: 1px;
        }
        
        /* 简介卡片 */
        .profile-card {
            border-radius: 28px;
            padding: 40px 48px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.15);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 380px;
            display: flex;
            align-items: center;
            transition: transform 0.3s ease;
        }
        
        .profile-card:hover {
            transform: translateY(-2px);
        }
        
        .profile-card-default {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .has-bg-image {
            position: relative;
        }
        
        .profile-card-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.6) 100%);
            border-radius: 28px;
        }
        
        .profile-card {
            position: relative;
        }
        
        .profile-bio {
            color: white;
            line-height: 1.9;
            position: relative;
            z-index: 1;
            width: 100%;
        }
        
        .profile-bio p {
            margin-bottom: 18px;
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        
        /* 右侧边栏 */
        .sidebar-right {
            width: 340px;
            flex-shrink: 0;
            position: sticky;
            top: 24px;
        }
        
        .article-list-area {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.5);
            height: calc(100vh - 280px);
            min-height: 450px;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }
        
        .article-list-area:hover {
            transform: translateY(-2px);
        }
        
        .article-list-area h3 {
            font-size: 16px;
            color: #4a5568;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            letter-spacing: 0.5px;
        }
        
        .article-list-area h3::before {
            content: '📖';
            font-size: 18px;
        }
        
        .article-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }
        
        .article-list::-webkit-scrollbar {
            width: 5px;
        }
        
        .article-list::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 10px;
        }
        
        .article-list::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
        }
        
        .article-item {
            padding: 16px;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #e2e8f0;
            cursor: pointer;
        }
        
        .article-item:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transform: translateX(6px);
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        
        .article-item:hover .article-title a {
            color: white;
        }
        
        .article-item:hover .article-meta {
            color: rgba(255,255,255,0.8);
        }
        
        .article-item:hover .article-source {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        
        .article-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .article-title a {
            color: #2d3748;
            text-decoration: none;
            transition: color 0.2s;
        }
        
        .article-meta {
            font-size: 12px;
            color: #a0aec0;
            display: flex;
            gap: 12px;
            transition: color 0.2s;
        }
        
        .article-source {
            background: #e2e8f0;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            color: #4a5568;
            transition: all 0.2s;
        }
        
        /* 响应式 */
        @media (max-width: 1000px) {
            .container {
                flex-direction: column;
                padding: 16px;
            }
            .sidebar-left, .sidebar-right {
                width: 100%;
                position: static;
            }
            .shortcuts-area, .article-list-area {
                height: auto;
                max-height: 320px;
            }
            .shortcut-buttons {
                flex-direction: row;
                flex-wrap: wrap;
                overflow-y: visible;
            }
            .shortcut {
                flex: 1;
                min-width: 100px;
            }
            .article-list {
                flex-direction: row;
                flex-wrap: wrap;
                overflow-y: visible;
            }
            .article-item {
                flex: 1;
                min-width: 220px;
            }
            .header-bg {
                padding: 50px 20px;
            }
            .header-bg h1 {
                font-size: 32px;
            }
            .profile-card {
                padding: 30px 24px;
                min-height: auto;
            }
        }
        
        /* 加载动画 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .sidebar-left, .content-center, .sidebar-right {
            animation: fadeInUp 0.5s ease-out;
        }
        
        .content-center {
            animation-delay: 0.1s;
        }
        
        .sidebar-right {
            animation-delay: 0.2s;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar-left">
        <div class="logo-area">
            <div class="logo" id="logoContainer">
                <div class="logo-text" id="defaultLogo">ZM</div>
            </div>
            <div class="beijing-time" id="beijingTime"></div>
        </div>
        <div class="shortcuts-area">
            <h3>快捷链接</h3>
            <div class="shortcut-buttons" id="shortcutList"></div>
        </div>
    </div>

    <div class="content-center">
        <div class="blog-header">
            <div class="header-bg" id="headerBg">
                <h1>张小明的博客</h1>
                <p>记录思考 · 分享技术 · 共同成长</p>
            </div>
        </div>
        
        <div class="profile-card profile-card-default" id="profileCard">
            <div class="profile-bio">
                <p>🌟 你好！我是一名热爱技术的全栈开发工程师，拥有5年Web开发经验。</p>
                <p>📝 这个博客主要分享前端开发、后端架构、云原生技术等方面的学习心得和实践经验。</p>
                <p>🎯 我相信技术应该服务于人，希望通过持续写作帮助更多人成长。</p>
                <p>📧 联系我：xiaoming.zhang@example.com</p>
                <p>💡 点击右侧文章列表，可以直接跳转到我的博客文章或其他优质技术文章。</p>
            </div>
        </div>
    </div>

    <div class="sidebar-right">
        <div class="article-list-area">
            <h3>文章列表</h3>
            <div class="article-list" id="articleList"></div>
        </div>
    </div>
</div>

<script>
// 北京时间
function updateBeijingTime() {
    var now = new Date();
    var year = now.getFullYear();
    var month = String(now.getMonth() + 1).padStart(2, '0');
    var day = String(now.getDate()).padStart(2, '0');
    var hours = String(now.getHours()).padStart(2, '0');
    var minutes = String(now.getMinutes()).padStart(2, '0');
    var seconds = String(now.getSeconds()).padStart(2, '0');
    var timeString = year + '-' + month + '-' + day + ' ' + hours + ':' + minutes + ':' + seconds;
    document.getElementById('beijingTime').innerHTML = timeString;
}
updateBeijingTime();
setInterval(updateBeijingTime, 1000);

// ========== 快捷按钮列表 ==========
var shortcuts = [
    ['GitHub', 'https://github.com'],
    ['掘金', 'https://juejin.cn'],
    ['知乎', 'https://zhihu.com'],
    ['阮一峰', 'https://ruanyifeng.com'],
    ['Vue.js', 'https://vuejs.org'],
    ['React', 'https://reactjs.org'],
    ['Tailwind CSS', 'https://tailwindcss.com'],
    ['MDN', 'https://developer.mozilla.org'],
    ['Stack Overflow', 'https://stackoverflow.com'],
    ['Google', 'https://google.com'],
];

function renderShortcuts() {
    var html = '';
    for (var i = 0; i < shortcuts.length; i++) {
        html = html + '<a class="shortcut" href="' + shortcuts[i][1] + '" target="_blank" rel="noopener noreferrer">' + shortcuts[i][0] + '</a>';
    }
    document.getElementById('shortcutList').innerHTML = html;
}
renderShortcuts();

// ========== 文章列表 ==========
var articles = [
    { title: '欢迎来到我的博客', date: '2026-04-26', source: '本站', url: 'https://raw.githubusercontent.com/你的用户名/仓库名/main/posts/welcome.md' },
    { title: 'EdgeOne Pages 部署教程', date: '2026-04-25', source: '本站', url: 'https://raw.githubusercontent.com/你的用户名/仓库名/main/posts/edgeone-tutorial.md' },
    { title: 'Vue 3 完整指南', date: '2026-04-20', source: 'Vue官方', url: 'https://vuejs.org/guide/introduction.html' },
    { title: 'React 18 新特性', date: '2026-04-18', source: 'React官方', url: 'https://react.dev/blog/2022/03/29/react-v18' },
    { title: '前端性能优化完全指南', date: '2026-04-10', source: '掘金', url: 'https://juejin.cn/post/123456789' },
    { title: 'TypeScript 入门前端', date: '2026-04-05', source: '知乎', url: 'https://zhuanlan.zhihu.com/p/123456789' },
];

function renderArticleList() {
    var html = '';
    for (var i = 0; i < articles.length; i++) {
        var a = articles[i];
        html = html + '<div class="article-item">';
        html = html + '<div class="article-title"><a href="' + a.url + '" target="_blank" rel="noopener noreferrer">' + a.title + '</a></div>';
        html = html + '<div class="article-meta">';
        html = html + '<span>📅 ' + a.date + '</span>';
        html = html + '<span class="article-source">' + a.source + '</span>';
        html = html + '</div>';
        html = html + '</div>';
    }
    document.getElementById('articleList').innerHTML = html;
}
renderArticleList();

// ==================== 图片配置区域 ====================
// 在这里填写你的图片URL，留空则使用默认渐变色

// 1. LOGO图片 (建议 120x120 像素，圆形显示)
var logoImageUrl = '';
// 例如: 'https://example.com/logo.png' 或 './images/logo.png'

// 2. 页眉背景图 (建议 1400x300 像素)
var headerBgImageUrl = '';
// 例如: 'https://example.com/header-bg.jpg' 或 './images/header-bg.jpg'

// 3. 简介卡片背景图 (自适应全图，建议 800x400 以上)
var cardBgImageUrl = '';
// 例如: 'https://example.com/card-bg.jpg' 或 './images/card-bg.jpg'

// ==================== 应用图片配置 ====================

if (logoImageUrl) {
    var logoContainer = document.getElementById('logoContainer');
    logoContainer.innerHTML = '<img src="' + logoImageUrl + '" alt="Logo">';
}

var headerBg = document.getElementById('headerBg');
if (headerBgImageUrl) {
    headerBg.style.backgroundImage = 'url(' + headerBgImageUrl + ')';
    headerBg.style.backgroundSize = 'cover';
    headerBg.style.backgroundPosition = 'center';
    headerBg.style.backgroundRepeat = 'no-repeat';
    headerBg.classList.remove('header-bg-default');
} else {
    headerBg.classList.add('header-bg-default');
}

var profileCard = document.getElementById('profileCard');
if (cardBgImageUrl) {
    profileCard.style.backgroundImage = 'url(' + cardBgImageUrl + ')';
    profileCard.style.backgroundSize = 'cover';
    profileCard.style.backgroundPosition = 'center';
    profileCard.style.backgroundRepeat = 'no-repeat';
    profileCard.classList.remove('profile-card-default');
    profileCard.classList.add('has-bg-image');
    profileCard.style.position = 'relative';
    var overlay = document.createElement('div');
    overlay.className = 'profile-card-bg';
    profileCard.insertBefore(overlay, profileCard.firstChild);
} else {
    profileCard.classList.add('profile-card-default');
}
</script>

</body>
</html>
