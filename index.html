<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>张小明的博客</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
            color: #1a202c;
            line-height: 1.6;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at 25% 50%, rgba(102, 126, 234, 0.03) 0%, transparent 50%),
                              radial-gradient(circle at 75% 30%, rgba(118, 75, 162, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
            display: flex;
            gap: 28px;
            position: relative;
            z-index: 1;
            align-items: stretch;
        }

        /* 左侧边栏 */
        .sidebar-left {
            width: 280px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }

        .logo-area {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.5);
            transition: transform 0.3s ease;
        }

        .logo-area:hover {
            transform: translateY(-2px);
        }

        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
            color: white;
        }

        .beijing-time {
            font-size: 17px;
            font-weight: 600;
            color: #2d3748;
            background: linear-gradient(135deg, #edf2f7 0%, #e2e8f0 100%);
            padding: 8px 14px;
            border-radius: 40px;
            display: inline-block;
            font-family: monospace;
        }

        .shortcuts-area {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.5);
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .shortcuts-area h3 {
            font-size: 15px;
            color: #4a5568;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .shortcuts-area h3::before {
            content: '✨';
        }

        .shortcut-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            overflow-y: auto;
        }

        .shortcut-buttons::-webkit-scrollbar {
            width: 5px;
        }

        .shortcut-buttons::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 10px;
        }

        .shortcut-buttons::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
        }

        .shortcut {
            display: block;
            padding: 8px 12px;
            background: #f8fafc;
            border-radius: 12px;
            text-decoration: none;
            color: #3182ce;
            font-weight: 500;
            border: 1px solid #e2e8f0;
            text-align: center;
            transition: all 0.3s;
            font-size: 13px;
        }

        .shortcut:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: translateX(6px);
            border-color: transparent;
        }

        /* 中间区域 */
        .content-center {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .blog-header {
            margin-bottom: 20px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.15);
        }

        .header-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 40px;
            text-align: center;
        }

        .header-bg h1 {
            font-size: 38px;
            color: white;
            margin-bottom: 8px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.2);
        }

        .header-bg p {
            color: rgba(255,255,255,0.95);
            font-size: 16px;
        }

        .profile-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 24px;
            padding: 28px 36px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.15);
            flex: 1;
        }

        .profile-bio {
            color: white;
            line-height: 1.7;
        }

        .profile-bio p {
            margin-bottom: 12px;
            font-size: 14px;
        }

        .profile-bio p:last-child {
            margin-bottom: 0;
        }

        /* 右侧边栏 */
        .sidebar-right {
            width: 340px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }

        .article-list-area {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.5);
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .article-list-area h3 {
            font-size: 15px;
            color: #4a5568;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .article-list-area h3::before {
            content: '📖';
        }

        .article-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            overflow-y: auto;
        }

        .article-list::-webkit-scrollbar {
            width: 5px;
        }

        .article-list::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 10px;
        }

        .article-list::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
        }

        .article-item {
            padding: 12px 14px;
            background: #f8fafc;
            border-radius: 14px;
            transition: all 0.3s;
            border: 1px solid #e2e8f0;
            cursor: pointer;
        }

        .article-item:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transform: translateX(6px);
        }

        .article-item:hover .article-title {
            color: white;
        }

        .article-item:hover .article-meta {
            color: rgba(255,255,255,0.8);
        }

        .article-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #2d3748;
        }

        .article-meta {
            font-size: 11px;
            color: #a0aec0;
            display: flex;
            gap: 10px;
        }

        @media (max-width: 1000px) {
            .container {
                flex-direction: column;
            }
            .sidebar-left, .sidebar-right {
                width: 100%;
            }
            .shortcut-buttons {
                flex-direction: row;
                flex-wrap: wrap;
            }
            .shortcut {
                flex: 1;
                min-width: 80px;
            }
            .article-list {
                flex-direction: row;
                flex-wrap: wrap;
            }
            .article-item {
                flex: 1;
                min-width: 200px;
            }
            .header-bg {
                padding: 30px 20px;
            }
            .header-bg h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar-left">
        <div class="logo-area">
            <div class="logo">ZM</div>
            <div class="beijing-time" id="beijingTime"></div>
        </div>
        <div class="shortcuts-area">
            <h3>快捷链接</h3>
            <div class="shortcut-buttons" id="shortcutList"></div>
        </div>
    </div>

    <div class="content-center">
        <div class="blog-header">
            <div class="header-bg">
                <h1>张小明的博客</h1>
                <p>记录思考 · 分享技术 · 共同成长</p>
            </div>
        </div>
        <div class="profile-card">
            <div class="profile-bio">
                <p>🌟 你好！我是一名热爱技术的全栈开发工程师，拥有5年Web开发经验。</p>
                <p>📝 这个博客主要分享前端开发、后端架构、云原生技术等方面的学习心得。</p>
                <p>🎯 我相信技术应该服务于人，希望通过写作帮助更多人成长。</p>
                <p>📧 联系我：xiaoming.zhang@example.com</p>
                <p>💡 点击右侧文章列表，直接跳转查看文章。</p>
            </div>
        </div>
    </div>

    <div class="sidebar-right">
        <div class="article-list-area">
            <h3>文章列表</h3>
            <div class="article-list" id="articleList"></div>
        </div>
    </div>
</div>

<script>
// 北京时间
function updateBeijingTime() {
    var now = new Date();
    var year = now.getFullYear();
    var month = String(now.getMonth() + 1).padStart(2, '0');
    var day = String(now.getDate()).padStart(2, '0');
    var hours = String(now.getHours()).padStart(2, '0');
    var minutes = String(now.getMinutes()).padStart(2, '0');
    var seconds = String(now.getSeconds()).padStart(2, '0');
    document.getElementById('beijingTime').innerHTML = year + '-' + month + '-' + day + ' ' + hours + ':' + minutes + ':' + seconds;
}
updateBeijingTime();
setInterval(updateBeijingTime, 1000);

// 快捷按钮
var shortcuts = [
    ['GitHub', 'https://github.com'],
    ['掘金', 'https://juejin.cn'],
    ['知乎', 'https://zhihu.com'],
    ['阮一峰', 'https://ruanyifeng.com'],
    ['Vue.js', 'https://vuejs.org'],
    ['React', 'https://reactjs.org'],
    ['Tailwind CSS', 'https://tailwindcss.com'],
    ['MDN', 'https://developer.mozilla.org'],
    ['Stack Overflow', 'https://stackoverflow.com'],
    ['Google', 'https://google.com']
];

var shortcutHtml = '';
for (var i = 0; i < shortcuts.length; i++) {
    shortcutHtml += '<a class="shortcut" href="' + shortcuts[i][1] + '" target="_blank">' + shortcuts[i][0] + '</a>';
}
document.getElementById('shortcutList').innerHTML = shortcutHtml;

// ========== 文章数据（直接在这里添加/删除文章） ==========
var articles = [
    {
        title: '欢迎来到我的博客',
        date: '2026-04-26',
        content: '<h1>欢迎来到我的博客</h1><p>大家好！欢迎访问我的个人博客。</p><h2>为什么写博客？</h2><p>记录技术成长、分享学习心得。</p><ul><li>加深理解</li><li>帮助他人</li><li>建立品牌</li></ul>'
    },
    {
        title: 'EdgeOne Pages 部署教程',
        date: '2026-04-25',
        content: '<h1>EdgeOne Pages 部署教程</h1><p>腾讯云 EdgeOne Pages 是一个强大的静态网站托管平台。</p><h2>部署步骤</h2><ol><li>登录腾讯云</li><li>导入Git仓库</li><li>点击部署</li></ol>'
    },
    {
        title: 'Markdown 写作指南',
        date: '2026-04-24',
        content: '<h1>Markdown 写作指南</h1><p>Markdown是一种轻量级标记语言。</p><h2>基础语法</h2><ul><li>标题：使用#</li><li>列表：使用-</li><li>粗体：**文字**</li></ul>'
    },
    {
        title: 'Vue.js 入门教程',
        date: '2026-04-20',
        content: '<h1>Vue.js 入门教程</h1><p>Vue.js是一个渐进式JavaScript框架。</p><h2>核心特性</h2><ul><li>响应式数据绑定</li><li>组件化开发</li><li>虚拟DOM</li></ul>'
    },
    {
        title: 'React 快速上手',
        date: '2026-04-18',
        content: '<h1>React 快速上手</h1><p>React是一个用于构建用户界面的JavaScript库。</p><h2>核心概念</h2><ul><li>组件</li><li>State</li><li>Props</li><li>Hooks</li></ul>'
    }
];

// 显示文章
function showArticle(index) {
    var a = articles[index];
    var win = window.open();
    var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + a.title + '</title>';
    html += '<style>';
    html += 'body{font-family:Arial;max-width:800px;margin:0 auto;padding:40px;line-height:1.8;}';
    html += 'h1{color:#2d3748;}';
    html += '.date{color:#999;margin-bottom:20px;}';
    html += 'hr{margin:20px 0;}';
    html += 'ul,ol{margin-left:30px;}';
    html += '</style>';
    html += '</head><body>';
    html += '<h1>' + a.title + '</h1>';
    html += '<div class="date">📅 ' + a.date + '</div><hr>';
    html += a.content;
    html += '<hr><p><a href="javascript:window.close()">关闭窗口</a></p>';
    html += '</body></html>';
    win.document.write(html);
    win.document.close();
}

window.showArticle = showArticle;

// 渲染文章列表
var articleHtml = '';
for (var i = 0; i < articles.length; i++) {
    var a = articles[i];
    var excerpt = a.content.replace(/<[^>]*>/g, '').substring(0, 80);
    if (excerpt.length >= 80) excerpt += '...';
    articleHtml += '<div class="article-item" onclick="showArticle(' + i + ')">';
    articleHtml += '<div class="article-title">' + a.title + '</div>';
    articleHtml += '<div class="article-meta">📅 ' + a.date + ' | ' + excerpt + '</div>';
    articleHtml += '</div>';
}
document.getElementById('articleList').innerHTML = articleHtml;
</script>

</body>
</html>
