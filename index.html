<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Blog</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 30px;
        }
        .sidebar {
            width: 280px;
        }
        .logo-area {
            background: white;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }
        .logo {
            width: 120px;
            height: 120px;
            background: navy;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            border-radius: 60px;
            font-size: 20px;
        }
        .time {
            font-size: 18px;
            background: #eee;
            padding: 8px;
            border-radius: 12px;
        }
        .shortcuts-area {
            background: white;
            border-radius: 16px;
            padding: 20px;
        }
        .shortcuts-area h3 {
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #ddd;
        }
        .shortcut {
            display: block;
            padding: 8px;
            background: #f5f5f5;
            text-decoration: none;
            color: #0066cc;
            text-align: center;
            margin-bottom: 8px;
            border-radius: 8px;
        }
        .main-content {
            flex: 1;
        }
        .header {
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }
        .post-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .post-title {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .post-title a {
            text-decoration: none;
            color: #333;
        }
        .post-meta {
            color: #999;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .readmore {
            display: inline-block;
            margin-top: 10px;
            color: #0066cc;
        }
        .loading {
            text-align: center;
            padding: 50px;
            color: #999;
        }
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <div class="logo-area">
            <div class="logo">BLOG</div>
            <div class="time" id="time"></div>
        </div>
        <div class="shortcuts-area">
            <h3>Quick Links</h3>
            <div id="shortcuts"></div>
        </div>
    </div>
    <div class="main-content">
        <div class="header">
            <h1>My Blog</h1>
            <p>Share knowledge and experiences</p>
        </div>
        <div id="posts"><div class="loading">Loading posts...</div></div>
    </div>
</div>

<script>
function showTime() {
    var d = new Date();
    var h = d.getHours();
    var m = d.getMinutes();
    var s = d.getSeconds();
    if (h < 10) h = '0' + h;
    if (m < 10) m = '0' + m;
    if (s < 10) s = '0' + s;
    document.getElementById('time').innerHTML = h + ':' + m + ':' + s;
}
showTime();
setInterval(showTime, 1000);

var links = [
    ['GitHub', 'https://github.com'],
    ['Google', 'https://google.com'],
    ['Stack Overflow', 'https://stackoverflow.com'],
    ['Juejin', 'https://juejin.cn'],
    ['Zhihu', 'https://zhihu.com'],
    ['Ruan Yifeng', 'https://ruanyifeng.com'],
    ['Vue', 'https://vuejs.org'],
    ['React', 'https://reactjs.org'],
    ['Tailwind', 'https://tailwindcss.com'],
    ['MDN', 'https://developer.mozilla.org']
];

var shortcutsHtml = '';
for (var i = 0; i < links.length; i++) {
    shortcutsHtml = shortcutsHtml + '<a class="shortcut" href="' + links[i][1] + '" target="_blank">' + links[i][0] + '</a>';
}
document.getElementById('shortcuts').innerHTML = shortcutsHtml;

var postsData = [
    {title: 'Welcome to My Blog', date: '2026-04-26', content: '<p>Welcome to my blog. This is the first post.</p><p>I will share technical knowledge and experiences here.</p>', excerpt: 'Welcome to my blog. This is the first post.'},
    {title: 'EdgeOne Pages Tutorial', date: '2026-04-25', content: '<p>EdgeOne Pages is a static site hosting platform.</p><p>Steps: 1. Login 2. Import repo 3. Deploy</p>', excerpt: 'EdgeOne Pages is a static site hosting platform.'},
    {title: 'Markdown Guide', date: '2026-04-24', content: '<p>Markdown is a lightweight markup language.</p><p>Use # for headers, - for lists, ** for bold.</p>', excerpt: 'Markdown is a lightweight markup language.'}
];

function viewPost(idx) {
    var p = postsData[idx];
    var w = window.open();
    w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + p.title + '</title>');
    w.document.write('<style>body{font-family:Arial;max-width:800px;margin:0 auto;padding:40px;}</style>');
    w.document.write('</head><body>');
    w.document.write('<h1>' + p.title + '</h1>');
    w.document.write('<p style="color:#999;">' + p.date + '</p>');
    w.document.write('<hr>');
    w.document.write(p.content);
    w.document.write('<hr><p><a href="javascript:window.close()">Close</a></p>');
    w.document.write('</body></html>');
    w.document.close();
}

window.viewPost = viewPost;

var postsHtml = '';
for (var i = 0; i < postsData.length; i++) {
    var p = postsData[i];
    postsHtml = postsHtml + '<div class="post-card">';
    postsHtml = postsHtml + '<h2 class="post-title"><a href="javascript:viewPost(' + i + ')">' + p.title + '</a></h2>';
    postsHtml = postsHtml + '<div class="post-meta">' + p.date + '</div>';
    postsHtml = postsHtml + '<p>' + p.excerpt + '</p>';
    postsHtml = postsHtml + '<a class="readmore" href="javascript:viewPost(' + i + ')">Read More →</a>';
    postsHtml = postsHtml + '</div>';
}
document.getElementById('posts').innerHTML = postsHtml;
</script>

</body>
</html>
