<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Blog</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .logo {
            width: 120px;
            height: 120px;
            background: navy;
            color: white;
            display: inline-block;
            text-align: center;
            line-height: 120px;
            border-radius: 60px;
        }
        .time {
            margin: 10px 0;
            font-size: 18px;
        }
        .shortcut {
            display: inline-block;
            margin: 5px;
            padding: 5px 10px;
            background: #eee;
            text-decoration: none;
            color: black;
            border-radius: 5px;
        }
        .post {
            border-bottom: 1px solid #ccc;
            padding: 20px 0;
        }
        .post h2 a {
            text-decoration: none;
            color: #333;
        }
        .post h2 a:hover {
            color: blue;
        }
        .readmore {
            display: inline-block;
            margin-top: 10px;
            color: blue;
            cursor: pointer;
        }
        .loading {
            text-align: center;
            padding: 50px;
            color: #999;
        }
    </style>
</head>
<body>

<div style="text-align: center;">
    <div class="logo">BLOG</div>
    <div class="time" id="time"></div>
    <div id="shortcuts"></div>
</div>

<div id="posts"><div class="loading">Loading posts...</div></div>

<script>
// show time
function showTime() {
    var d = new Date();
    var h = d.getHours();
    var m = d.getMinutes();
    var s = d.getSeconds();
    if (h < 10) h = '0' + h;
    if (m < 10) m = '0' + m;
    if (s < 10) s = '0' + s;
    document.getElementById('time').innerHTML = h + ':' + m + ':' + s;
}
showTime();
setInterval(showTime, 1000);

// shortcuts
var sites = [
    'GitHub', 'Google', 'StackOverflow', 'Juejin', 'Zhihu',
    'RuanYifeng', 'Vue', 'React', 'Tailwind', 'MDN'
];
var urls = [
    'https://github.com', 'https://google.com', 'https://stackoverflow.com', 'https://juejin.cn', 'https://zhihu.com',
    'https://ruanyifeng.com', 'https://vuejs.org', 'https://reactjs.org', 'https://tailwindcss.com', 'https://developer.mozilla.org'
];

var html = '';
for (var i = 0; i < sites.length; i++) {
    html = html + '<a class="shortcut" href="' + urls[i] + '" target="_blank">' + sites[i] + '</a>';
}
document.getElementById('shortcuts').innerHTML = html;

// posts config
var postsConfig = [
    {title: 'Welcome to My Blog', date: '2026-04-26', file: 'posts/welcome.md'},
    {title: 'EdgeOne Pages Tutorial', date: '2026-04-25', file: 'posts/edgeone-tutorial.md'},
    {title: 'Markdown Guide', date: '2026-04-24', file: 'posts/markdown-guide.md'}
];

var loadedPosts = [];

// markdown to html
function mdToHtml(md) {
    if (!md) return '';
    var h = md;
    h = h.replace(/^# (.*$)/gm, '<h1>$1</h1>');
    h = h.replace(/^## (.*$)/gm, '<h2>$1</h2>');
    h = h.replace(/^### (.*$)/gm, '<h3>$1</h3>');
    h = h.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    h = h.replace(/\*(.*?)\*/g, '<em>$1</em>');
    h = h.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>');
    h = h.replace(/^- (.*$)/gm, '<li>$1</li>');
    h = h.replace(/^[0-9]+\. (.*$)/gm, '<li>$1</li>');
    if (h.indexOf('<li>') !== -1) {
        h = '<ul>' + h + '</ul>';
    }
    h = h.replace(/\n/g, '<br>');
    return h;
}

// get excerpt
function getExcerpt(md) {
    if (!md) return '';
    var text = md.replace(/[#*]/g, '');
    if (text.length > 150) {
        text = text.substring(0, 150) + '...';
    }
    return text;
}

// show post
function showPost(index) {
    var post = loadedPosts[index];
    if (!post) return;
    var win = window.open();
    var page = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + post.title + '</title>';
    page = page + '<style>body{font-family:Arial;max-width:800px;margin:0 auto;padding:40px;line-height:1.8;}</style>';
    page = page + '</head><body>';
    page = page + '<h1>' + post.title + '</h1>';
    page = page + '<p style="color:#999;">' + post.date + '</p>';
    page = page + '<hr>';
    page = page + post.html;
    page = page + '<hr><p><a href="javascript:window.close()">Close Window</a></p>';
    page = page + '</body></html>';
    win.document.write(page);
    win.document.close();
}

window.showPost = showPost;

// load posts
function loadPosts() {
    var promises = [];
    
    for (var i = 0; i < postsConfig.length; i++) {
        var cfg = postsConfig[i];
        var promise = fetch(cfg.file)
            .then(function(response) {
                if (!response.ok) throw new Error('fail');
                return response.text();
            })
            .then(function(md) {
                return {
                    title: cfg.title,
                    date: cfg.date,
                    html: mdToHtml(md),
                    excerpt: getExcerpt(md)
                };
            })
            .catch(function() {
                return {
                    title: cfg.title,
                    date: cfg.date,
                    html: '<p>Failed to load post</p>',
                    excerpt: 'Failed to load post'
                };
            });
        promises.push(promise);
    }
    
    Promise.all(promises).then(function(results) {
        loadedPosts = results;
        var postsHtml = '';
        for (var i = 0; i < results.length; i++) {
            var p = results[i];
            postsHtml = postsHtml + '<div class="post">';
            postsHtml = postsHtml + '<h2><a href="javascript:showPost(' + i + ')">' + p.title + '</a></h2>';
            postsHtml = postsHtml + '<div>' + p.date + '</div>';
            postsHtml = postsHtml + '<p>' + p.excerpt + '</p>';
            postsHtml = postsHtml + '<a class="readmore" href="javascript:showPost(' + i + ')">Read More →</a>';
            postsHtml = postsHtml + '</div>';
        }
        document.getElementById('posts').innerHTML = postsHtml;
    }).catch(function(err) {
        document.getElementById('posts').innerHTML = '<div class="loading">Load failed, please refresh</div>';
    });
}

loadPosts();
</script>

</body>
</html>
