<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>我的博客</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .logo {
            width: 120px;
            height: 120px;
            background: navy;
            color: white;
            display: inline-block;
            text-align: center;
            line-height: 120px;
            border-radius: 60px;
        }
        .time {
            margin: 10px 0;
        }
        .shortcut {
            display: inline-block;
            margin: 5px;
            padding: 5px 10px;
            background: #eee;
            text-decoration: none;
            color: black;
        }
        .post {
            border-bottom: 1px solid #ccc;
            padding: 20px 0;
        }
    </style>
</head>
<body>

<div style="text-align: center;">
    <div class="logo">BLOG</div>
    <div class="time" id="time"></div>
    <div id="shortcuts"></div>
</div>

<div id="posts"></div>

<script>
// 显示时间
function showTime() {
    var d = new Date();
    var h = d.getHours();
    var m = d.getMinutes();
    var s = d.getSeconds();
    if (h < 10) h = '0' + h;
    if (m < 10) m = '0' + m;
    if (s < 10) s = '0' + s;
    document.getElementById('time').innerHTML = h + ':' + m + ':' + s;
}
showTime();
setInterval(showTime, 1000);

// 快捷按钮
var sites = [
    'GitHub', 'Google', 'Stack Overflow', '掘金', '知乎',
    '阮一峰', 'Vue.js', 'React', 'Tailwind', 'MDN'
];
var urls = [
    'https://github.com', 'https://google.com', 'https://stackoverflow.com', 'https://juejin.cn', 'https://zhihu.com',
    'https://ruanyifeng.com', 'https://vuejs.org', 'https://reactjs.org', 'https://tailwindcss.com', 'https://developer.mozilla.org'
];

var html = '';
for (var i = 0; i < sites.length; i++) {
    html = html + '<a class="shortcut" href="' + urls[i] + '" target="_blank">' + sites[i] + '</a>';
}
document.getElementById('shortcuts').innerHTML = html;

// 文章数据
var posts = [
    {title: '欢迎来到我的博客', date: '2026-04-26', content: '这是第一篇博客文章的内容。'},
    {title: 'EdgeOne Pages 部署', date: '2026-04-25', content: 'EdgeOne Pages 部署教程的内容。'},
    {title: 'Markdown 指南', date: '2026-04-24', content: 'Markdown 写作指南的内容。'}
];

// 显示文章
var postsHtml = '';
for (var i = 0; i < posts.length; i++) {
    var p = posts[i];
    postsHtml = postsHtml + '<div class="post">';
    postsHtml = postsHtml + '<h2>' + p.title + '</h2>';
    postsHtml = postsHtml + '<div>' + p.date + '</div>';
    postsHtml = postsHtml + '<p>' + p.content + '</p>';
    postsHtml = postsHtml + '</div>';
}
document.getElementById('posts').innerHTML = postsHtml;
</script>

</body>
</html>
