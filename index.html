<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>张小明的博客</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
            color: #1a202c;
            line-height: 1.6;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at 25% 50%, rgba(102, 126, 234, 0.03) 0%, transparent 50%),
                              radial-gradient(circle at 75% 30%, rgba(118, 75, 162, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
            display: flex;
            gap: 28px;
            position: relative;
            z-index: 1;
            align-items: stretch;
        }

        /* 左侧边栏 */
        .sidebar-left {
            width: 280px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }

        .logo-area {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
            color: white;
        }

        .beijing-time {
            font-size: 17px;
            font-weight: 600;
            color: #2d3748;
            background: linear-gradient(135deg, #edf2f7 0%, #e2e8f0 100%);
            padding: 8px 14px;
            border-radius: 40px;
            display: inline-block;
            font-family: monospace;
        }

        .shortcuts-area {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.5);
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .shortcuts-area h3 {
            font-size: 15px;
            color: #4a5568;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e2e8f0;
        }

        .shortcuts-area h3::before {
            content: '✨';
            margin-right: 8px;
        }

        .shortcut-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            overflow-y: auto;
        }

        .shortcut {
            display: block;
            padding: 8px 12px;
            background: #f8fafc;
            border-radius: 12px;
            text-decoration: none;
            color: #3182ce;
            font-weight: 500;
            border: 1px solid #e2e8f0;
            text-align: center;
            transition: all 0.3s;
            font-size: 13px;
        }

        .shortcut:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: translateX(6px);
        }

        /* 中间区域 */
        .content-center {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .blog-header {
            margin-bottom: 20px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.15);
        }

        .header-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px;
            text-align: center;
        }

        .header-bg h1 {
            font-size: 38px;
            color: white;
            margin-bottom: 8px;
        }

        .header-bg p {
            color: rgba(255,255,255,0.95);
            font-size: 16px;
        }

        .profile-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 24px;
            padding: 28px 36px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.15);
            flex: 1;
        }

        .profile-bio {
            color: white;
            line-height: 1.7;
        }

        .profile-bio p {
            margin-bottom: 12px;
            font-size: 14px;
        }

        /* 右侧边栏 */
        .sidebar-right {
            width: 340px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }

        .article-list-area {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.5);
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .article-list-area h3 {
            font-size: 15px;
            color: #4a5568;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e2e8f0;
        }

        .article-list-area h3::before {
            content: '📖';
            margin-right: 8px;
        }

        .article-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            overflow-y: auto;
        }

        .article-item {
            padding: 12px 14px;
            background: #f8fafc;
            border-radius: 14px;
            transition: all 0.3s;
            border: 1px solid #e2e8f0;
            cursor: pointer;
        }

        .article-item:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transform: translateX(6px);
        }

        .article-item:hover .article-title {
            color: white;
        }

        .article-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #2d3748;
        }

        .article-date {
            font-size: 11px;
            color: #a0aec0;
        }

        @media (max-width: 1000px) {
            .container {
                flex-direction: column;
            }
            .sidebar-left, .sidebar-right {
                width: 100%;
            }
            .shortcut-buttons {
                flex-direction: row;
                flex-wrap: wrap;
            }
            .shortcut {
                flex: 1;
                min-width: 80px;
            }
            .article-list {
                flex-direction: row;
                flex-wrap: wrap;
            }
            .article-item {
                flex: 1;
                min-width: 200px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar-left">
        <div class="logo-area">
            <div class="logo">ZM</div>
            <div class="beijing-time" id="beijingTime"></div>
        </div>
        <div class="shortcuts-area">
            <h3>快捷链接</h3>
            <div class="shortcut-buttons" id="shortcutList"></div>
        </div>
    </div>

    <div class="content-center">
        <div class="blog-header">
            <div class="header-bg">
                <h1>张小明的博客</h1>
                <p>记录思考 · 分享技术 · 共同成长</p>
            </div>
        </div>
        <div class="profile-card">
            <div class="profile-bio">
                <p>🌟 你好！我是一名热爱技术的全栈开发工程师，拥有5年Web开发经验。</p>
                <p>📝 这个博客主要分享前端开发、后端架构、云原生技术等方面的学习心得。</p>
                <p>🎯 我相信技术应该服务于人，希望通过写作帮助更多人成长。</p>
                <p>📧 联系我：xiaoming.zhang@example.com</p>
                <p>💡 点击右侧文章列表，直接跳转查看文章。</p>
            </div>
        </div>
    </div>

    <div class="sidebar-right">
        <div class="article-list-area">
            <h3>文章列表</h3>
            <div class="article-list" id="articleList"></div>
        </div>
    </div>
</div>

<script>
// 北京时间
function updateBeijingTime() {
    var now = new Date();
    var year = now.getFullYear();
    var month = String(now.getMonth() + 1).padStart(2, '0');
    var day = String(now.getDate()).padStart(2, '0');
    var hours = String(now.getHours()).padStart(2, '0');
    var minutes = String(now.getMinutes()).padStart(2, '0');
    var seconds = String(now.getSeconds()).padStart(2, '0');
    document.getElementById('beijingTime').innerHTML = year + '-' + month + '-' + day + ' ' + hours + ':' + minutes + ':' + seconds;
}
updateBeijingTime();
setInterval(updateBeijingTime, 1000);

// 快捷按钮
var shortcuts = [
    ['GitHub', 'https://github.com'],
    ['掘金', 'https://juejin.cn'],
    ['知乎', 'https://zhihu.com'],
    ['阮一峰', 'https://ruanyifeng.com'],
    ['Vue.js', 'https://vuejs.org'],
    ['React', 'https://reactjs.org'],
    ['Tailwind CSS', 'https://tailwindcss.com'],
    ['MDN', 'https://developer.mozilla.org'],
    ['Stack Overflow', 'https://stackoverflow.com'],
    ['Google', 'https://google.com']
];

var shortcutHtml = '';
for (var i = 0; i < shortcuts.length; i++) {
    shortcutHtml += '<a class="shortcut" href="' + shortcuts[i][1] + '" target="_blank">' + shortcuts[i][0] + '</a>';
}
document.getElementById('shortcutList').innerHTML = shortcutHtml;

// 文章列表 - 链接指向 EdgeOne 托管的 md 文件
// 注意：域名请替换成你自己的 EdgeOne 域名
var baseUrl = window.location.origin;

var articles = [
    { title: '欢迎来到我的博客', date: '2026-04-26', url: baseUrl + '/posts/welcome.md' },
    { title: 'EdgeOne Pages 部署教程', date: '2026-04-25', url: baseUrl + '/posts/edgeone-tutorial.md' },
    { title: 'Markdown 写作指南', date: '2026-04-24', url: baseUrl + '/posts/markdown-guide.md' },
    { title: 'Vue.js 入门教程', date: '2026-04-20', url: baseUrl + '/posts/vue-guide.md' },
    { title: '项目简介', date: '2026-04-26', url: baseUrl + '/posts/README.md' },
    { title: 'React 快速上手', date: '2026-04-18', url: baseUrl + '/posts/react-guide.md' }
];

function viewArticle(url) {
    window.open(url, '_blank');
}

window.viewArticle = viewArticle;

var articleHtml = '';
for (var i = 0; i < articles.length; i++) {
    var a = articles[i];
    articleHtml += '<div class="article-item" onclick="viewArticle(\'' + a.url + '\')">';
    articleHtml += '<div class="article-title">' + a.title + '</div>';
    articleHtml += '<div class="article-date">' + a.date + '</div>';
    articleHtml += '</div>';
}
document.getElementById('articleList').innerHTML = articleHtml;
</script>

</body>
</html>
