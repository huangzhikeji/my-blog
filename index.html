<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Blog</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .sidebar {
            float: left;
            width: 250px;
            margin-right: 30px;
        }
        .main {
            float: left;
            width: calc(100% - 280px);
        }
        .logo-box {
            background: #f0f0f0;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }
        .logo {
            width: 120px;
            height: 120px;
            background: navy;
            color: white;
            line-height: 120px;
            margin: 0 auto;
            border-radius: 50%;
        }
        .time-box {
            margin-top: 10px;
            font-size: 18px;
        }
        .links-box {
            background: #f0f0f0;
            padding: 20px;
        }
        .link {
            display: block;
            padding: 8px;
            margin: 5px 0;
            background: white;
            text-decoration: none;
            color: blue;
            text-align: center;
        }
        .post {
            background: #f0f0f0;
            padding: 20px;
            margin-bottom: 20px;
        }
        .post h2 {
            margin: 0 0 10px 0;
        }
        .post h2 a {
            text-decoration: none;
            color: black;
        }
        .date {
            color: gray;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }
        @media (max-width: 768px) {
            .sidebar, .main {
                float: none;
                width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="clearfix">
    <div class="sidebar">
        <div class="logo-box">
            <div class="logo">BLOG</div>
            <div class="time-box" id="time"></div>
        </div>
        <div class="links-box">
            <strong>Quick Links</strong>
            <div id="links"></div>
        </div>
    </div>
    <div class="main">
        <h1>My Blog</h1>
        <div id="posts"></div>
    </div>
</div>

<script>
function updateTime() {
    var d = new Date();
    var h = d.getHours();
    var m = d.getMinutes();
    var s = d.getSeconds();
    h = h < 10 ? '0' + h : h;
    m = m < 10 ? '0' + m : m;
    s = s < 10 ? '0' + s : s;
    document.getElementById('time').innerHTML = h + ':' + m + ':' + s;
}
updateTime();
setInterval(updateTime, 1000);

var linkNames = ['GitHub', 'Google', 'StackOverflow', 'Juejin', 'Zhihu', 'RuanYifeng', 'Vue', 'React', 'Tailwind', 'MDN'];
var linkUrls = [
    'https://github.com',
    'https://google.com',
    'https://stackoverflow.com',
    'https://juejin.cn',
    'https://zhihu.com',
    'https://ruanyifeng.com',
    'https://vuejs.org',
    'https://reactjs.org',
    'https://tailwindcss.com',
    'https://developer.mozilla.org'
];

var linkHtml = '';
for (var i = 0; i < linkNames.length; i++) {
    linkHtml = linkHtml + '<a class="link" href="' + linkUrls[i] + '" target="_blank">' + linkNames[i] + '</a>';
}
document.getElementById('links').innerHTML = linkHtml;

var posts = [
    {title: 'Welcome to My Blog', date: '2026-04-26', file: 'posts/welcome.md'},
    {title: 'EdgeOne Pages Tutorial', date: '2026-04-25', file: 'posts/edgeone-tutorial.md'},
    {title: 'Markdown Guide', date: '2026-04-24', file: 'posts/markdown-guide.md'}
];

function showPost(title, date, content) {
    var w = window.open();
    w.document.write('<html><head><title>' + title + '</title></head><body>');
    w.document.write('<h1>' + title + '</h1>');
    w.document.write('<p>' + date + '</p><hr>');
    w.document.write(content);
    w.document.write('<hr><p><a href="javascript:window.close()">Close</a></p>');
    w.document.write('</body></html>');
    w.document.close();
}

function loadPost(index) {
    var p = posts[index];
    var xhr = new XMLHttpRequest();
    xhr.open('GET', p.file, true);
    xhr.onload = function() {
        if (xhr.status === 200) {
            var content = xhr.responseText;
            content = content.replace(/^# (.*$)/gm, '<h1>$1</h1>');
            content = content.replace(/^## (.*$)/gm, '<h2>$1</h2>');
            content = content.replace(/\n/g, '<br>');
            showPost(p.title, p.date, content);
        } else {
            showPost(p.title, p.date, '<p>Failed to load post</p>');
        }
    };
    xhr.onerror = function() {
        showPost(p.title, p.date, '<p>Failed to load post</p>');
    };
    xhr.send();
}

window.loadPost = loadPost;

var postsHtml = '';
for (var i = 0; i < posts.length; i++) {
    var p = posts[i];
    postsHtml = postsHtml + '<div class="post">';
    postsHtml = postsHtml + '<h2><a href="javascript:loadPost(' + i + ')">' + p.title + '</a></h2>';
    postsHtml = postsHtml + '<div class="date">' + p.date + '</div>';
    postsHtml = postsHtml + '</div>';
}
document.getElementById('posts').innerHTML = postsHtml;
</script>
</body>
</html>
