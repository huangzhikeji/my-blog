<!DOCTYPE html>
<html>
<head>
    <title>My Blog</title>
    <style>
        body {
            font-family: Arial;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .left {
            float: left;
            width: 250px;
        }
        .right {
            float: left;
            width: 700px;
        }
        .logo {
            width: 120px;
            height: 120px;
            background: blue;
            color: white;
            text-align: center;
            line-height: 120px;
            border-radius: 50%;
        }
        .time {
            font-size: 20px;
            margin: 10px 0;
        }
        .btn {
            display: block;
            padding: 8px;
            margin: 5px 0;
            background: #eee;
            text-align: center;
        }
        .card {
            background: #eee;
            padding: 20px;
            margin-bottom: 20px;
        }
        a {
            color: blue;
            text-decoration: none;
        }
        .clear:after {
            content: "";
            clear: both;
            display: table;
        }
    </style>
</head>
<body>
<div class="clear">
    <div class="left">
        <div class="logo">BLOG</div>
        <div class="time" id="t"></div>
        <div id="links"></div>
    </div>
    <div class="right">
        <h1>My Blog</h1>
        <div id="posts"></div>
    </div>
</div>
<script>
function clock() {
    var d = new Date();
    var h = d.getHours();
    var m = d.getMinutes();
    var s = d.getSeconds();
    if (h < 10) h = '0' + h;
    if (m < 10) m = '0' + m;
    if (s < 10) s = '0' + s;
    document.getElementById('t').innerHTML = h + ':' + m + ':' + s;
}
clock();
setInterval(clock, 1000);

var names = ['Github','Google','StackOverflow','Juejin','Zhihu','RuanYifeng','Vue','React','Tailwind','MDN'];
var urls = [
    'https://github.com',
    'https://google.com',
    'https://stackoverflow.com',
    'https://juejin.cn',
    'https://zhihu.com',
    'https://ruanyifeng.com',
    'https://vuejs.org',
    'https://reactjs.org',
    'https://tailwindcss.com',
    'https://developer.mozilla.org'
];

var linkHtml = '';
for (var i = 0; i < names.length; i++) {
    linkHtml = linkHtml + '<a class="btn" href="' + urls[i] + '" target="_blank">' + names[i] + '</a>';
}
document.getElementById('links').innerHTML = linkHtml;

var articles = [
    {title: 'Welcome', date: '2026-04-26', file: 'posts/welcome.md'},
    {title: 'EdgeOne Pages', date: '2026-04-25', file: 'posts/edgeone-tutorial.md'},
    {title: 'Markdown', date: '2026-04-24', file: 'posts/markdown-guide.md'}
];

function openPost(title, date, content) {
    var w = window.open();
    w.document.write('<html><head><title>' + title + '</title></head><body>');
    w.document.write('<h1>' + title + '</h1>');
    w.document.write('<p>' + date + '</p>');
    w.document.write(content);
    w.document.write('<p><a href="javascript:window.close()">Close</a></p>');
    w.document.write('</body></html>');
    w.document.close();
}

function loadPost(idx) {
    var a = articles[idx];
    var x = new XMLHttpRequest();
    x.open('GET', a.file, true);
    x.onload = function() {
        if (x.status == 200) {
            var c = x.responseText;
            c = c.replace(/^# /gm, '<h1>');
            c = c.replace(/^## /gm, '<h2>');
            c = c.replace(/\n/g, '<br>');
            openPost(a.title, a.date, c);
        } else {
            openPost(a.title, a.date, '<p>Error loading</p>');
        }
    };
    x.send();
}

var postsHtml = '';
for (var i = 0; i < articles.length; i++) {
    var a = articles[i];
    postsHtml = postsHtml + '<div class="card">';
    postsHtml = postsHtml + '<h2><a href="javascript:loadPost(' + i + ')">' + a.title + '</a></h2>';
    postsHtml = postsHtml + '<p>' + a.date + '</p>';
    postsHtml = postsHtml + '</div>';
}
document.getElementById('posts').innerHTML = postsHtml;
</script>
</body>
</html>
