<!DOCTYPE html>
<!-- 声明HTML5文档类型，告诉浏览器使用标准模式渲染 -->
<html>
<head>
    <!-- meta charset="UTF-8"：设置字符编码为UTF-8，支持中文显示，必须放在最前面 -->
    <meta charset="UTF-8">
    <!-- viewport：移动端适配，width=device-width让页面宽度等于设备宽度，initial-scale=1.0初始缩放比例为1 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- title：浏览器标签页上显示的标题 -->
    <title>张小明的博客</title>
    
    <!-- ==================== CSS 样式开始 ==================== -->
    <style>
        /* ---------- 全局重置 ---------- */
        /* * 通配符选择器，选中页面所有元素 */
        * {
            margin: 0;      /* 清除默认外边距 */
            padding: 0;     /* 清除默认内边距 */
            box-sizing: border-box;  /* 盒模型：宽高包含border和padding，布局更直观 */
        }

        /* body：页面主体样式 */
        body {
            /* 字体栈：依次尝试使用系统字体，确保各平台显示效果一致 */
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Roboto, Arial, sans-serif;
            /* 渐变色背景：135deg对角线方向，从浅灰色渐变到更浅的灰色 */
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
            color: #1a202c;        /* 文字颜色：深灰 */
            line-height: 1.6;      /* 行高1.6倍，阅读更舒适 */
            min-height: 100vh;     /* 最小高度占满整个视口高度 */
        }

        /* 伪元素 ::before：用于添加背景装饰光晕效果 */
        body::before {
            content: '';           /* 必须有content属性，伪元素才能显示 */
            position: fixed;       /* 固定定位，相对于浏览器视口 */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* radial-gradient径向渐变：创建两个圆形光晕 */
            background-image: radial-gradient(circle at 25% 50%, rgba(102, 126, 234, 0.03) 0%, transparent 50%),
                              radial-gradient(circle at 75% 30%, rgba(118, 75, 162, 0.03) 0%, transparent 50%);
            pointer-events: none;  /* 让这个元素不响应鼠标事件，点击会穿透到下层元素 */
            z-index: 0;            /* 层级0，放在最底层作为背景装饰 */
        }

        /* ---------- 主容器：三栏布局 ---------- */
        .container {
            max-width: 1400px;     /* 最大宽度限制，大屏幕时内容居中 */
            margin: 0 auto;        /* 水平居中：上下0，左右auto */
            padding: 24px;         /* 内边距24像素 */
            display: flex;         /* 使用Flexbox弹性布局 */
            gap: 28px;             /* 子元素之间的间距28像素 */
            position: relative;    /* 相对定位，让z-index生效 */
            z-index: 1;            /* 层级1，在背景装饰之上 */
            align-items: stretch;  /* 子元素高度自动拉伸，实现等高效果 */
        }

        /* ---------- 左侧边栏 ---------- */
        .sidebar-left {
            width: 280px;          /* 固定宽度280像素 */
            flex-shrink: 0;        /* 不允许缩小，保持固定宽度 */
            display: flex;
            flex-direction: column; /* 子元素垂直排列 */
        }

        /* LOGO区域 */
        .logo-area {
            background: rgba(255,255,255,0.95);  /* 半透明白色背景 */
            backdrop-filter: blur(10px);         /* 毛玻璃模糊效果 */
            border-radius: 28px;                 /* 圆角28像素 */
            padding: 24px 20px;
            text-align: center;
            /* 阴影：水平偏移 垂直偏移 模糊半径 扩散半径 颜色 */
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.5);  /* 半透明白色边框 */
            transition: transform 0.3s ease;          /* 动画过渡：0.3秒缓动 */
        }
        /* 鼠标悬停时向上浮起2像素 */
        .logo-area:hover {
            transform: translateY(-2px);
        }

        /* LOGO容器：支持文字和图片两种模式 */
        .logo {
            width: 120px;          /* 宽度120像素，符合你的需求 */
            height: 120px;         /* 高度120像素 */
            margin: 0 auto 15px;   /* 上下0，左右auto实现水平居中，下边距15像素 */
            border-radius: 50%;    /* 圆形：50%圆角 */
            overflow: hidden;      /* 超出部分隐藏（图片超出圆形时裁剪） */
            /* 默认渐变色背景（当没有图片时显示） */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;    /* 垂直居中 */
            justify-content: center; /* 水平居中 */
            font-size: 26px;
            font-weight: bold;
            color: white;
        }
        /* LOGO内的图片样式 */
        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;      /* 图片按比例覆盖整个区域，可能裁剪 */
        }

        /* 北京时间显示区域 */
        .beijing-time {
            font-size: 17px;
            font-weight: 600;
            color: #2d3748;
            background: linear-gradient(135deg, #edf2f7 0%, #e2e8f0 100%);
            padding: 8px 14px;
            border-radius: 40px;     /* 大圆角，类似胶囊形状 */
            display: inline-block;    /* 内联块，宽度由内容决定 */
            font-family: monospace;   /* 等宽字体，时间数字对齐更整齐 */
        }

        /* 快捷按钮区域 */
        .shortcuts-area {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.5);
            display: flex;
            flex-direction: column;
            flex: 1;                 /* 占据剩余空间，与右侧等高 */
        }

        /* 区域标题 */
        .shortcuts-area h3 {
            font-size: 15px;
            color: #4a5568;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e2e8f0;  /* 下边框作为分隔线 */
        }
        /* 伪元素：在标题前添加装饰图标 */
        .shortcuts-area h3::before {
            content: '✨';           /* 添加星星图标 */
            margin-right: 8px;
        }

        /* 快捷按钮容器：可滚动 */
        .shortcut-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;              /* 按钮之间的间距 */
            flex: 1;
            overflow-y: auto;      /* 内容超出时显示垂直滚动条 */
        }

        /* 自定义滚动条样式（WebKit浏览器：Chrome、Edge、Safari） */
        .shortcut-buttons::-webkit-scrollbar {
            width: 5px;            /* 滚动条宽度5像素 */
        }
        .shortcut-buttons::-webkit-scrollbar-track {
            background: #e2e8f0;   /* 滚动条轨道背景色 */
            border-radius: 10px;
        }
        .shortcut-buttons::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); /* 滚动条滑块渐变色 */
            border-radius: 10px;
        }

        /* 单个快捷按钮 */
        .shortcut {
            display: block;
            padding: 8px 12px;
            background: #f8fafc;   /* 浅灰背景 */
            border-radius: 12px;
            text-decoration: none;   /* 去掉下划线 */
            color: #3182ce;         /* 蓝色文字 */
            font-weight: 500;
            border: 1px solid #e2e8f0;
            text-align: center;
            transition: all 0.3s;    /* 所有属性变化都有0.3秒过渡动画 */
            font-size: 13px;
        }
        /* 鼠标悬停效果 */
        .shortcut:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); /* 渐变色背景 */
            color: white;
            transform: translateX(6px);  /* 向右移动6像素 */
        }

        /* ---------- 中间区域（页眉 + 个人简介） ---------- */
        .content-center {
            flex: 1;                /* 占据剩余空间 */
            display: flex;
            flex-direction: column;
        }

        /* 页眉横幅 */
        .blog-header {
            margin-bottom: 20px;
            border-radius: 24px;
            overflow: hidden;       /* 超出部分隐藏，保持圆角效果 */
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.15);
        }

        /* 页眉背景：支持图片或渐变 */
        .header-bg {
            background-size: cover;      /* 背景图片覆盖整个区域 */
            background-position: center; /* 背景图片居中 */
            background-repeat: no-repeat; /* 不重复 */
            padding: 40px;
            text-align: center;
        }
        /* 默认渐变背景类（没有图片时使用） */
        .header-bg-default {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .header-bg h1 {
            font-size: 38px;
            color: white;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);  /* 文字阴影，增加可读性 */
        }

        .header-bg p {
            color: rgba(255,255,255,0.95);
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        /* 个人简介卡片：支持图片或渐变 */
        .profile-card {
            border-radius: 24px;
            padding: 28px 36px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.15);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            flex: 1;
            position: relative;    /* 相对定位，用于遮罩层 */
        }
        /* 默认渐变背景 */
        .profile-card-default {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        /* 有背景图时的半透明遮罩层 */
        .profile-card-bg {
            position: absolute;      /* 绝对定位，相对于父元素 */
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);  /* 半透明黑色，让白色文字更清晰 */
            border-radius: 24px;
        }

        /* 简介文字内容 */
        .profile-bio {
            color: white;
            line-height: 1.7;
            position: relative;      /* 相对定位，让z-index生效，显示在遮罩之上 */
            z-index: 1;
        }

        .profile-bio p {
            margin-bottom: 12px;
            font-size: 14px;
        }

        /* ---------- 右侧边栏（文章列表） ---------- */
        .sidebar-right {
            width: 340px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }

        .article-list-area {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.5);
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .article-list-area h3::before {
            content: '📖';
            margin-right: 8px;
        }

        /* 文章列表容器：可滚动 */
        .article-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            overflow-y: auto;
        }

        /* 单个文章项 */
        .article-item {
            padding: 12px 14px;
            background: #f8fafc;
            border-radius: 14px;
            transition: all 0.3s;
            border: 1px solid #e2e8f0;
            cursor: pointer;        /* 鼠标变手型，表示可点击 */
        }

        .article-item:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transform: translateX(6px);
        }

        .article-item:hover .article-title {
            color: white;           /* 悬停时标题变白 */
        }

        .article-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #2d3748;
        }

        .article-date {
            font-size: 11px;
            color: #a0aec0;
        }

        /* ---------- 响应式设计：屏幕宽度小于1000px时 ---------- */
        @media (max-width: 1000px) {
            .container {
                flex-direction: column;  /* 三栏改为垂直排列 */
            }
            .sidebar-left, .sidebar-right {
                width: 100%;            /* 占满宽度 */
            }
            .shortcut-buttons {
                flex-direction: row;    /* 改水平排列 */
                flex-wrap: wrap;        /* 允许换行 */
            }
            .shortcut {
                flex: 1;
                min-width: 80px;
            }
            .article-list {
                flex-direction: row;
                flex-wrap: wrap;
            }
            .article-item {
                flex: 1;
                min-width: 200px;
            }
            .header-bg {
                padding: 30px 20px;
            }
            .header-bg h1 {
                font-size: 28px;
            }
            .profile-card {
                padding: 22px 24px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ========== 左侧边栏 ========== -->
    <div class="sidebar-left">
        <div class="logo-area">
            <!-- LOGO容器，id用于JavaScript动态替换图片 -->
            <div class="logo" id="logoContainer">
                <span id="logoText">ZM</span>  <!-- 默认显示文字LOGO -->
            </div>
            <!-- 北京时间显示区域，id用于JavaScript更新内容 -->
            <div class="beijing-time" id="beijingTime"></div>
        </div>
        <div class="shortcuts-area">
            <h3>快捷链接</h3>
            <!-- 快捷按钮容器，id用于JavaScript动态生成按钮 -->
            <div class="shortcut-buttons" id="shortcutList"></div>
        </div>
    </div>

    <!-- ========== 中间区域 ========== -->
    <div class="content-center">
        <div class="blog-header">
            <!-- 页眉背景容器，id用于JavaScript设置背景图片 -->
            <div class="header-bg header-bg-default" id="headerBg">
                <h1>张小明的博客</h1>
                <p>记录思考 · 分享技术 · 共同成长</p>
            </div>
        </div>
        <!-- 简介卡片容器，id用于JavaScript设置背景图片 -->
        <div class="profile-card profile-card-default" id="profileCard">
            <div class="profile-bio">
                <p>🌟 你好！我是一名热爱技术的全栈开发工程师，拥有5年Web开发经验。</p>
                <p>📝 这个博客主要分享前端开发、后端架构、云原生技术等方面的学习心得。</p>
                <p>🎯 我相信技术应该服务于人，希望通过写作帮助更多人成长。</p>
                <p>📧 联系我：xiaoming.zhang@example.com</p>
                <p>💡 点击右侧文章列表，直接跳转查看文章。</p>
            </div>
        </div>
    </div>

    <!-- ========== 右侧边栏 ========== -->
    <div class="sidebar-right">
        <div class="article-list-area">
            <h3>文章列表</h3>
            <!-- 文章列表容器，id用于JavaScript动态生成列表 -->
            <div class="article-list" id="articleList"></div>
        </div>
    </div>
</div>

<script>
// ==================== JavaScript 代码 ====================

// ---------- 1. 北京时间显示 ----------
// 函数：获取当前时间并更新到页面
function updateBeijingTime() {
    // new Date()：创建一个Date对象，表示当前日期和时间
    var now = new Date();
    
    // getFullYear()：获取四位数的年份，如2026
    var year = now.getFullYear();
    // getMonth()：获取月份（0-11），0表示一月，所以要+1
    // String()：转换为字符串
    // padStart(2, '0')：如果不足2位，前面补0，如 4 -> '04'
    var month = String(now.getMonth() + 1).padStart(2, '0');
    // getDate()：获取日期（1-31）
    var day = String(now.getDate()).padStart(2, '0');
    // getHours()：获取小时（0-23）
    var hours = String(now.getHours()).padStart(2, '0');
    // getMinutes()：获取分钟（0-59）
    var minutes = String(now.getMinutes()).padStart(2, '0');
    // getSeconds()：获取秒（0-59）
    var seconds = String(now.getSeconds()).padStart(2, '0');
    
    // 拼接时间字符串，格式：2026-04-26 14:30:25
    var timeString = year + '-' + month + '-' + day + ' ' + hours + ':' + minutes + ':' + seconds;
    
    // document.getElementById()：根据id获取页面元素
    // .innerHTML：设置或获取元素的HTML内容
    document.getElementById('beijingTime').innerHTML = timeString;
}

// 立即执行一次，避免页面加载后1秒才有时间显示
updateBeijingTime();
// setInterval：定时器，每隔1000毫秒（1秒）执行一次updateBeijingTime
setInterval(updateBeijingTime, 1000);

// ---------- 2. 快捷按钮 ----------
// 二维数组：每个子数组 [显示文字, 跳转链接]
var shortcuts = [
    ['GitHub', 'https://github.com'],
    ['掘金', 'https://juejin.cn'],
    ['知乎', 'https://zhihu.com'],
    ['阮一峰', 'https://ruanyifeng.com'],
    ['Vue.js', 'https://vuejs.org'],
    ['React', 'https://reactjs.org'],
    ['Tailwind CSS', 'https://tailwindcss.com'],
    ['MDN', 'https://developer.mozilla.org'],
    ['Stack Overflow', 'https://stackoverflow.com'],
    ['Google', 'https://google.com']
];

// 变量，用于存储生成的HTML字符串
var shortcutHtml = '';
// for循环：遍历shortcuts数组
for (var i = 0; i < shortcuts.length; i++) {
    // 拼接HTML：<a>标签，class="shortcut"，href是链接，target="_blank"表示在新窗口打开
    shortcutHtml += '<a class="shortcut" href="' + shortcuts[i][1] + '" target="_blank">' + shortcuts[i][0] + '</a>';
}
// 把生成的HTML设置到id为shortcutList的元素中
document.getElementById('shortcutList').innerHTML = shortcutHtml;

// ---------- 3. 文章列表 ----------
// window.location.origin：获取当前页面的域名
// 例如：https://xxx.edgeone.cool 或 http://localhost:5500
var baseUrl = window.location.origin;

// 文章数组：每篇文章包含标题、日期、URL
var articles = [
    { title: '欢迎来到我的博客', date: '2026-04-26', url: baseUrl + '/posts/welcome.html' },
    { title: 'EdgeOne Pages 部署教程', date: '2026-04-25', url: baseUrl + '/posts/edgeone-tutorial.html' },
    { title: 'Markdown 写作指南', date: '2026-04-24', url: baseUrl + '/posts/markdown-guide.html' },
    { title: 'Vue.js 入门教程', date: '2026-04-20', url: baseUrl + '/posts/vue-guide.html' },
    { title: 'React 快速上手', date: '2026-04-18', url: baseUrl + '/posts/react-guide.html' }
];

// 函数：在新窗口打开文章
function viewArticle(url) {
    // window.open()：打开新窗口，'_blank'表示在新标签页打开
    window.open(url, '_blank');
}

// 把viewArticle函数挂载到window对象上，这样HTML中的onclick可以调用
window.viewArticle = viewArticle;

// 生成文章列表HTML
var articleHtml = '';
for (var i = 0; i < articles.length; i++) {
    var a = articles[i];
    // 注意：onclick中的字符串引号需要转义，\' 表示单引号
    articleHtml += '<div class="article-item" onclick="viewArticle(\'' + a.url + '\')">';
    articleHtml += '<div class="article-title">' + a.title + '</div>';
    articleHtml += '<div class="article-date">' + a.date + '</div>';
    articleHtml += '</div>';
}
// 把生成的HTML设置到id为articleList的元素中
document.getElementById('articleList').innerHTML = articleHtml;

// ---------- 4. 图片配置区域（可自定义） ----------
// 在这里填写你的图片URL，留空则使用默认渐变色

// 1. LOGO图片 (建议 120x120 像素，圆形显示)
// 使用方式：
//   - 外链图片：'https://example.com/logo.png'
//   - 本地图片：'./images/logo.png'
//   - 留空：'' 使用默认紫色渐变文字LOGO
var logoImageUrl = '';

// 2. 页眉背景图 (建议 1400x300 像素)
var headerBgImageUrl = '';

// 3. 简介卡片背景图 (自适应全图，建议 800x400 以上)
var cardBgImageUrl = '';

// ---------- 5. 应用图片配置 ----------

// 应用LOGO图片
// if语句：判断logoImageUrl是否不为空字符串
if (logoImageUrl) {
    // 获取LOGO容器元素
    var logoContainer = document.getElementById('logoContainer');
    // 清空容器，放入img标签，src属性设置为图片URL，alt是替代文字
    logoContainer.innerHTML = '<img src="' + logoImageUrl + '" alt="Logo">';
}

// 应用页眉背景图
var headerBg = document.getElementById('headerBg');
if (headerBgImageUrl) {
    // style.backgroundImage：设置CSS背景图片
    headerBg.style.backgroundImage = 'url(' + headerBgImageUrl + ')';
    headerBg.style.backgroundSize = 'cover';      // 图片覆盖整个区域
    headerBg.style.backgroundPosition = 'center'; // 图片居中
    // classList.remove()：移除默认渐变样式类
    headerBg.classList.remove('header-bg-default');
} else {
    // 没有图片时，添加默认渐变样式类
    headerBg.classList.add('header-bg-default');
}

// 应用简介卡片背景图
var profileCard = document.getElementById('profileCard');
if (cardBgImageUrl) {
    profileCard.style.backgroundImage = 'url(' + cardBgImageUrl + ')';
    profileCard.style.backgroundSize = 'cover';
    profileCard.style.backgroundPosition = 'center';
    profileCard.classList.remove('profile-card-default');
    
    // 创建半透明遮罩层，让白色文字更清晰可读
    var overlay = document.createElement('div');  // 创建新div元素
    overlay.className = 'profile-card-bg';        // 设置类名
    // insertBefore()：将遮罩层插入到profileCard的第一个子元素之前
    profileCard.insertBefore(overlay, profileCard.firstChild);
} else {
    profileCard.classList.add('profile-card-default');
}
</script>

</body>
</html>
